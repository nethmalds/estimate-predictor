# Dev infrastructure — Postgres, Chroma, Redis.
# Runs alongside uvicorn (backend) and next dev (frontend) on the host.
#
# Usage:
#   cp backend/.env.local.example backend/.env.local   # first time only
#   docker compose up -d                                 # start infra
#   docker compose down                                  # stop infra
#
# Service ports (host-facing):
#   Postgres  → 5436  (avoids clashing with a local postgres on 5432)
#   Chroma    → 8080
#   Redis     → 6379

services:

  postgres_db:
    image: postgres:16-alpine
    container_name: estimation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma_db:
    image: chromadb/chroma:0.5.5
    container_name: estimation_chroma
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma

  redis:
    image: redis:7-alpine
    container_name: estimation_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  chroma_data:
